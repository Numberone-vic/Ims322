<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Test</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        input { padding: 10px; font-size: 16px; margin: 10px; width: 200px; }
        button { padding: 12px 20px; font-size: 16px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>JavaScript Cookie Test</h2>
    
    <div>
        <input type="text" id="cookieValue" value="GitHubTest" placeholder="Enter value">
    </div>
    
    <button onclick="createCookie()">1. Create Cookie</button>
    <button onclick="showCookie()">2. Read Cookie</button>

    <script>
        function createCookie() {
            const cookieName = "mobile_user";
            const cookieValue = document.getElementById('cookieValue').value;
            
            // Your exact string to set a 1-year lifespan cookie
            document.cookie = `${cookieName}=${encodeURIComponent(cookieValue)}; max-age=31536000; path=/; SameSite=Lax`;
            
            alert(`Cookie "${cookieName}" created for 1 year!`);
        }

        function showCookie() {
            if (document.cookie) {
                alert("Current Cookies:\n" + decodeURIComponent(document.cookie));
            } else {
                alert("No cookies found. Make sure cookies are enabled in your browser settings!");
            }
        }
    </script>
</body>
</html>
