<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Test</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        button { padding: 15px 25px; font-size: 16px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>JavaScript Cookie Test</h2>
    <button onclick="createTestCookie()">1. Create Cookie</button>
    <button onclick="showCookie()">2. Read Cookie</button>

    <script>
        function createTestCookie() {
            // Sets a cookie named "mobile_user" that lasts 1 day
            const date = new Date();
            date.setTime(date.getTime() + (1 * 24 * 60 * 60 * 1000));
            document.cookie = "mobile_user=GitHubTest; expires=" + date.toUTCString() + "; path=/; SameSite=Lax";
            alert("Cookie created successfully!");
        }

        function showCookie() {
            alert("Current Document Cookies:\n" + document.cookie);
        }
    </script>
</body>
</html>
