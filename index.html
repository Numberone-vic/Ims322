<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETBD Cookie Assignment</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 400px; 
            margin: 40px auto; 
            padding: 20px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
        }
        .form-group { 
            margin-bottom: 15px; 
            text-align: left; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
        }
        input[type="text"], input[type="email"] { 
            width: 100%; 
            padding: 8px; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background-color: #007BFF; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-size: 16px; 
            cursor: pointer; 
        }
        button:hover { 
            background-color: #0056b3; 
        }
        .cookie-display { 
            margin-top: 20px; 
            padding: 10px; 
            background-color: #f8f9fa; 
            border-radius: 4px; 
            font-size: 14px; 
            word-break: break-all; 
        }
    </style>
</head>
<body>

    <h2>User Registration</h2>
    
    <form id="userForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" required placeholder="John Doe">
        </div>
        
        <div class="form-group">
            <label for="address">Street Address</label>
            <input type="text" id="address" required placeholder="123 Main St">
        </div>
        
        <div class="form-group">
            <label for="emailAddress">Email Address (Username)</label>
            <input type="email" id="emailAddress" required placeholder="johndoe@example.com">
        </div>
        
        <button type="submit">Submit & Save Cookie</button>
    </form>

    <div class="cookie-display">
        <strong>Active Cookies:</strong>
        <p id="cookieStatus">No active cookies found.</p>
        <button onclick="checkCookies()" style="background-color: #6c757d; font-size: 12px; padding: 5px;">Refresh Cookie View</button>
    </div>

    <script>
        // Check for existing cookies right when the page loads
        window.onload = function() {
            checkCookies();
        };

        function handleSubmit(event) {
            event.preventDefault(); // Stop page from reloading

            const cookieName = "username";
            const cookieValue = document.getElementById('emailAddress').value;
            
            // Saves the email address as a cookie with a 1-year lifespan
            document.cookie = `${cookieName}=${encodeURIComponent(cookieValue)}; max-age=31536000; path=/; SameSite=Lax`;
            
            alert("Form submitted! Email address saved to cookie.");
            checkCookies();
        }

        function checkCookies() {
            const statusDisplay = document.getElementById('cookieStatus');
            if (document.cookie) {
                statusDisplay.textContent = decodeURIComponent(document.cookie);
            } else {
                statusDisplay.textContent = "No active cookies found.";
            }
        }
    </script>
</body>
</html>
